# SSATR Lab RabbitMQ REST API Configuration

# Server configuration
server.port=8080

# RabbitMQ connection configuration
# Assumes RabbitMQ is running locally with default settings
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue name configuration
# Two separate queues for different purposes:
# - API queue: Used by REST endpoints for publishing/retrieving messages
# - Processing queue: Monitored by MessageListener for background processing
app.rabbitmq.queue.api=ssatr.api.messages
app.rabbitmq.queue.processing=ssatr.processing.messages

# Logging configuration
logging.level.com.ssatr.lab=INFO
logging.level.org.springframework.amqp=INFO

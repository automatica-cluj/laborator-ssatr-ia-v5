# Database Configuration - Custom Environment
db.url=jdbc:postgresql://control.aut.utcluj.ro:11154/dbdronesample
db.username=student
db.password=student123

# HikariCP Connection Pool Configuration
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.poolName=DroneDB-Pool
db.pool.connectionTestQuery=SELECT 1

# Kafka Configuration - Custom Environment
kafka.bootstrap.servers=control.aut.utcluj.ro:11192

# Kafka Topics
kafka.topic.telemetry=drone-telemetry
kafka.topic.commands=drone-commands
kafka.topic.events=drone-events

# Kafka Producer Configuration
kafka.producer.acks=1
kafka.producer.retries=3
kafka.producer.linger.ms=10
kafka.producer.batch.size=16384

# Kafka Consumer Configuration
kafka.consumer.auto.offset.reset=latest
kafka.consumer.enable.auto.commit=false
kafka.consumer.max.poll.records=100
kafka.consumer.session.timeout.ms=30000

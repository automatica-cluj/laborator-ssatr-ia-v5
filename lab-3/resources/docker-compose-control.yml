version: '3.8'

services:
  # Zookeeper - necesar pentru coordonarea cluster-ului Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-control
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - drone-network-control
    volumes:
      - zookeeper-data-control:/var/lib/zookeeper/data
      - zookeeper-logs-control:/var/lib/zookeeper/log

  # Kafka Broker - message broker pentru streaming (configured for remote access)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-control
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://control.aut.utcluj.ro:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - drone-network-control
    volumes:
      - kafka-data-control:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # PostgreSQL - bază de date relațională pentru persistență
  postgres:
    image: postgres:15-alpine
    container_name: postgres-control
    environment:
      POSTGRES_DB: dronedb
      POSTGRES_USER: drone_admin
      POSTGRES_PASSWORD: Dr0n3Fl33t#2024!Secure
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - drone-network-control
    volumes:
      - postgres-data-control:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI (optional) - interfață web pentru administrare Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-control
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: control
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - drone-network-control

networks:
  drone-network-control:
    driver: bridge

volumes:
  zookeeper-data-control:
  zookeeper-logs-control:
  kafka-data-control:
  postgres-data-control:
